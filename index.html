<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>TSH 弁当注文</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0ea5e9" />
  <link rel="manifest" href="manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-sky-50 via-white to-orange-50 text-slate-800">
  <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

    <!-- Header -->
    <header class="flex flex-col sm:flex-row gap-4 sm:items-center sm:justify-between mb-6 sm:mb-8">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-white shadow-md shadow-sky-100 border border-sky-100 flex items-center justify-center overflow-hidden">
          <!-- Logo TSH (upload ke: frontend/icons/tsh.png) -->
          <img src="icons/tsh.png" alt="TSH ロゴ" class="w-full h-full object-contain">
        </div>
        <div>
          <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-sky-900">
            TSH 弁当注文
          </h1>
          <p class="text-xs sm:text-sm text-slate-500 mt-1">
            社員向け日替わり弁当の注文
          </p>
        </div>
      </div>
      <div class="flex flex-col items-end gap-1 text-[11px] sm:text-xs text-slate-500">
        <div class="flex flex-wrap gap-2">
          <span class="px-2 py-1 rounded-full bg-sky-100 text-sky-700 border border-sky-200">
            モバイル最適化
          </span>
          <span class="px-2 py-1 rounded-full bg-orange-100 text-orange-700 border border-orange-200">
            Windows / Android インストール可
          </span>
        </div>
        <span class="text-[11px] mt-1">
          <span class="font-semibold text-sky-700">Design by wahyu</span>
        </span>
      </div>
    </header>

    <!-- Tabs -->
    <div class="mb-4 sm:mb-6">
      <div class="inline-flex rounded-full bg-sky-100 p-1 border border-sky-200">
        <button id="tab-order"
          class="tab-btn px-3 sm:px-5 py-2 text-xs sm:text-sm rounded-full font-medium bg-white text-sky-900 border border-sky-300 shadow-sm">
          注文フォーム
        </button>
        <button id="tab-dashboard"
          class="tab-btn px-3 sm:px-5 py-2 text-xs sm:text-sm rounded-full font-medium text-slate-500 hover:text-sky-900 hover:bg-white/70">
          ダッシュボード
        </button>
      </div>
    </div>

    <!-- Main content -->
    <main class="space-y-6 sm:space-y-8">

      <!-- Order Section -->
      <section id="order-section" class="space-y-4 sm:space-y-6">
        <!-- Bento info -->
        <div class="bg-white border border-sky-100 rounded-2xl p-4 sm:p-5 shadow-sm shadow-sky-100">
          <h2 class="text-base sm:text-lg font-semibold mb-2 flex items-center gap-2 text-sky-900">
            <span>本日のメニュー</span>
            <span id="today-date-label" class="text-xs sm:text-sm text-slate-500"></span>
          </h2>
          <div id="today-menu" class="text-sm sm:text-base text-slate-800">
            読み込み中…
          </div>
        </div>

        <!-- Form -->
        <div class="bg-white border border-sky-100 rounded-2xl p-4 sm:p-5 shadow-sm shadow-sky-100">
          <h2 class="text-base sm:text-lg font-semibold mb-4 text-sky-900">
            弁当注文フォーム
          </h2>

          <form id="order-form" class="space-y-4 sm:space-y-5">
            <!-- Date -->
            <div class="space-y-1">
              <label class="block text-xs sm:text-sm text-slate-600">
                日付（受け取り日）
              </label>
              <input
                type="date"
                id="order-date"
                class="w-full rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
              />
            </div>

            <!-- Employee -->
            <div class="space-y-1">
              <label class="block text-xs sm:text-sm text-slate-600">
                社員名
              </label>
              <select
                id="employee-name"
                class="w-full rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400">
              </select>
              <p class="text-[11px] text-slate-500 mt-1">
                社員マスタに登録されていない場合は別シートで追加してください。
              </p>
            </div>

            <!-- Order / not order -->
            <div class="space-y-1">
              <span class="block text-xs sm:text-sm text-slate-600 mb-1">
                弁当を注文しますか？
              </span>
              <div class="flex flex-col sm:flex-row gap-2">
                <label
                  class="flex-1 flex items-center gap-2 rounded-xl border border-sky-200 bg-sky-50 px-3 py-2 text-sm cursor-pointer hover:border-sky-400">
                  <input type="radio" name="order-status" value="order" class="text-sky-500" checked />
                  <span>注文する</span>
                </label>
                <label
                  class="flex-1 flex items-center gap-2 rounded-xl border border-orange-200 bg-orange-50 px-3 py-2 text-sm cursor-pointer hover:border-orange-400">
                  <input type="radio" name="order-status" value="noOrder" class="text-orange-500" />
                  <span>注文しない</span>
                </label>
              </div>
            </div>

            <!-- Actions -->
            <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between pt-2">
              <button
                type="submit"
                class="inline-flex items-center justify-center rounded-xl bg-sky-600 hover:bg-sky-500 text-sm font-semibold px-4 py-2 text-white shadow-md shadow-sky-200">
                送信する
              </button>
              <p id="form-message" class="text-xs sm:text-sm text-slate-600"></p>
            </div>
          </form>
        </div>
      </section>

      <!-- Dashboard Section -->
      <section id="dashboard-section" class="hidden space-y-4 sm:space-y-6">
        <!-- Filter + download buttons -->
        <div class="bg-white border border-sky-100 rounded-2xl p-4 sm:p-5 shadow-sm shadow-sky-100 space-y-3">
          <div class="flex flex-col sm:flex-row gap-3 sm:items-end justify-between">
            <div class="space-y-1">
              <label class="block text-xs sm:text-sm text-slate-600">
                集計対象日
              </label>
              <input
                type="date"
                id="dashboard-date"
                class="w-full sm:w-auto rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
              />
            </div>
            <div class="space-y-1">
              <label class="block text-xs sm:text-sm text-slate-600">
                月間集計（yyyy-MM）
              </label>
              <input
                type="month"
                id="dashboard-month"
                class="w-full sm:w-auto rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
              />
            </div>
            <button
              id="btn-refresh-dashboard"
              class="w-full sm:w-auto inline-flex items-center justify-center rounded-xl bg-sky-600 hover:bg-sky-500 text-xs sm:text-sm font-semibold px-4 py-2 text-white shadow-sm shadow-sky-200">
              更新
            </button>
          </div>

          <div class="flex flex-wrap gap-2 text-[11px] sm:text-xs">
            <button id="btn-download-day"
              class="inline-flex items-center gap-1 rounded-full border border-sky-200 bg-sky-50 hover:bg-sky-100 px-3 py-1">
              日次Excelダウンロード
            </button>
            <button id="btn-download-week"
              class="inline-flex items-center gap-1 rounded-full border border-orange-200 bg-orange-50 hover:bg-orange-100 px-3 py-1">
              週次Excelダウンロード
            </button>
            <button id="btn-download-month"
              class="inline-flex items-center gap-1 rounded-full border border-sky-200 bg-sky-50 hover:bg-sky-100 px-3 py-1">
              月次Excelダウンロード
            </button>
          </div>
        </div>

        <!-- Today summary -->
        <div
          class="bg-white border border-sky-100 rounded-2xl p-4 sm:p-5 shadow-sm shadow-sky-100 space-y-3 sm:space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h2 class="text-base sm:text-lg font-semibold text-sky-900">
              本日の注文状況
            </h2>
            <span id="dashboard-date-label" class="text-xs sm:text-sm text-slate-500"></span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs sm:text-sm">
            <div
              class="rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 sm:px-4 sm:py-3 flex flex-col gap-1">
              <span class="text-slate-500">注文数</span>
              <span id="day-total-count" class="text-lg sm:text-xl font-semibold text-sky-900"></span>
            </div>
            <div
              class="rounded-xl bg-orange-50 border border-orange-200 px-3 py-2 sm:px-4 sm:py-3 flex flex-col gap-1">
              <span class="text-slate-500">合計金額</span>
              <span id="day-total-amount" class="text-lg sm:text-xl font-semibold text-orange-700"></span>
            </div>
          </div>

          <div class="mt-2">
            <h3 class="text-xs sm:text-sm text-slate-600 mb-2">社員別ステータス</h3>
            <div class="overflow-x-auto text-xs sm:text-sm">
              <table class="min-w-full border-collapse">
                <thead>
                  <tr class="border-b border-sky-100 text-slate-500">
                    <th class="text-left py-1 pr-4">社員名</th>
                    <th class="text-left py-1 pr-4">ステータス</th>
                    <th class="text-right py-1">小計</th>
                  </tr>
                </thead>
                <tbody id="day-orders-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Monthly summary -->
        <div
          class="bg-white border border-sky-100 rounded-2xl p-4 sm:p-5 shadow-sm shadow-sky-100 space-y-4">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h2 class="text-base sm:text-lg font-semibold text-sky-900">
              月間集計
            </h2>
            <span id="dashboard-month-label" class="text-xs sm:text-sm text-slate-500"></span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs sm:text-sm">
            <div
              class="rounded-xl bg-sky-50 border border-sky-200 px-3 py-2 sm:px-4 sm:py-3 flex flex-col gap-1">
              <span class="text-slate-500">注文数合計</span>
              <span id="month-total-count" class="text-lg sm:text-xl font-semibold text-sky-900"></span>
            </div>
            <div
              class="rounded-xl bg-orange-50 border border-orange-200 px-3 py-2 sm:px-4 sm:py-3 flex flex-col gap-1">
              <span class="text-slate-500">金額合計</span>
              <span id="month-total-amount" class="text-lg sm:text-xl font-semibold text-orange-700"></span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm">
            <!-- per employee -->
            <div>
              <h3 class="text-xs sm:text-sm text-slate-600 mb-2">社員別集計</h3>
              <div class="overflow-x-auto">
                <table class="min-w-full border-collapse">
                  <thead>
                    <tr class="border-b border-sky-100 text-slate-500">
                      <th class="text-left py-1 pr-4">社員名</th>
                      <th class="text-right py-1 pr-4">注文数</th>
                      <th class="text-right py-1">合計金額</th>
                    </tr>
                  </thead>
                  <tbody id="month-employee-body"></tbody>
                </table>
              </div>
            </div>

            <!-- per day -->
            <div>
              <h3 class="text-xs sm:text-sm text-slate-600 mb-2">日別集計</h3>
              <div class="overflow-x-auto">
                <table class="min-w-full border-collapse">
                  <thead>
                    <tr class="border-b border-sky-100 text-slate-500">
                      <th class="text-left py-1 pr-4">日付</th>
                      <th class="text-right py-1 pr-4">注文数</th>
                      <th class="text-right py-1">合計金額</th>
                    </tr>
                  </thead>
                  <tbody id="month-day-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </section>
    </main>

    <!-- Footer -->
    <footer class="mt-8 text-center text-[11px] sm:text-xs text-slate-500">
      <div class="flex items-center justify-center gap-2 mb-1">
        <img src="icons/tsh.png" alt="TSH ロゴ" class="w-5 h-5 object-contain">
        <span class="font-semibold text-sky-800">TSH 弁当注文</span>
      </div>
      <div>Design by wahyu</div>
    </footer>

  </div>

  <script src="app.js"></script>
</body>
</html>
